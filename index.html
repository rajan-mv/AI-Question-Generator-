<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <!-- Updated iPad-optimized viewport to prevent zooming on tap -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Question King by Rajan MV</title>
    
    <!-- Added PWA & Apple specific tags for standalone app functionality -->
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Question King">
    <link rel="apple-touch-icon" href="icon-192.png">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- KaTeX for Math Rendering -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        [x-cloak] { display: none !important; }
        .canvas-container { touch-action: none; }
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: #020617; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #334155; }
        
        @media print {
            body { background: #fdfbf7 !important; color: #111111 !important; font-family: 'Times New Roman', Times, serif !important; margin: 0 !important; padding: 0 !important; }
            header, section.w-5\/12, .no-print { display: none !important; }
            section.w-7\/12 { width: 100% !important; max-width: 100% !important; padding: 20px !important; background: #fdfbf7 !important; color: #111111 !important; overflow: visible !important; margin: 0 !important; border: none !important; box-shadow: none !important; }
            .print-paper-sheet { background: #fdfbf7 !important; color: #111111 !important; border: none !important; box-shadow: none !important; padding: 0 !important; text-align: justify !important; }
            .print-header-block { text-align: center; border-bottom: 2px solid #111; padding-bottom: 12px; margin-bottom: 20px; }
            .print-header-block h2 { font-size: 18px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; color: #111; margin: 0 0 5px 0; }
            .print-header-block p { font-size: 13px; font-weight: bold; text-transform: uppercase; color: #333; margin: 0; }
            .print-question-box { break-inside: avoid; page-break-inside: avoid; margin-bottom: 16px; font-size: 11.5pt; line-height: 1.4; color: #111; text-align: justify !important; }
            .print-options-grid-2 { display: grid !important; grid-template-columns: 1fr 1fr !important; gap: 4px 12px !important; margin-top: 4px; font-size: 11pt; text-align: justify !important; }
            .print-options-grid-1 { display: flex !important; flex-direction: column !important; gap: 6px !important; margin-top: 6px; font-size: 11pt; text-align: justify !important; }
            .print-solution-section { page-break-before: always; margin-top: 0; border: none; padding: 0; background: transparent !important; text-align: justify !important; }
            .text-slate-100, .text-slate-200, .text-slate-300, .text-amber-400, .text-cyan-400, .text-emerald-400 { color: #111 !important; }
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-full flex flex-col font-sans select-none antialiased" x-data="questionApp()">

    <!-- Header -->
    <header class="no-print bg-slate-900/90 backdrop-blur-md border-b border-slate-800/80 px-4 sm:px-6 py-3 flex flex-col sm:flex-row items-center justify-between shrink-0 gap-3 sticky top-0 z-50">
        <div class="flex items-center space-x-3 w-full sm:w-auto">
            <div class="bg-gradient-to-tr from-amber-500 to-indigo-600 p-2.5 rounded-xl text-white shadow-lg shadow-indigo-950/40 shrink-0">
                <i data-lucide="crown" class="w-6 h-6"></i>
            </div>
            <div>
                <h1 class="text-base sm:text-lg font-extrabold tracking-tight text-white flex items-center space-x-2">
                    <span class="bg-clip-text text-transparent bg-gradient-to-r from-amber-200 via-indigo-200 to-white">Question King</span>
                    <span class="text-[10px] bg-amber-500/10 text-amber-400 border border-amber-500/20 px-2 py-0.5 rounded-full font-mono uppercase tracking-wider">by Rajan MV</span>
                </h1>
                <p class="text-[11px] text-slate-400">Powered by Gemini 3.5 Flash-Lite • 30 Years Pedagogy Engine</p>
            </div>
        </div>
        
        <!-- Gemini API Key Input -->
        <div class="flex items-center space-x-2 w-full sm:w-auto justify-end">
            <div class="flex items-center space-x-2 bg-slate-950/80 px-3 py-1.5 rounded-xl border border-slate-800 focus-within:border-indigo-500 transition w-full sm:w-auto">
                <i data-lucide="key-round" class="w-4 h-4 text-slate-400 shrink-0"></i>
                <input type="password" x-model="apiKey" placeholder="Gemini API Key (AIzaSy...)" class="bg-transparent text-xs text-white focus:outline-none w-full sm:w-48">
            </div>
            <button @click="saveApiKey()" class="bg-indigo-600 hover:bg-indigo-500 text-xs px-3.5 py-2 rounded-xl font-medium shadow-md shadow-indigo-950/50 transition shrink-0">Save</button>
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="flex-1 flex flex-col lg:flex-row overflow-y-auto lg:overflow-hidden">
        
        <!-- Left Panel: Controls & Inputs -->
        <section class="no-print w-full lg:w-5/12 bg-slate-900/30 border-r border-slate-800/80 p-4 sm:p-6 overflow-y-auto flex flex-col space-y-5">
            
            <!-- Exam & Subject Selection -->
            <div class="grid grid-cols-2 gap-3 sm:gap-4">
                <div>
                    <label class="block text-[11px] font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Target Exam</label>
                    <select x-model="config.exam" @change="onExamChange()" class="w-full bg-slate-900 border border-slate-800 rounded-xl p-2.5 text-xs text-slate-200 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        <option value="JEE Advanced">JEE Advanced</option>
                        <option value="NEET">NEET</option>
                        <option value="JEE Main">JEE Main</option>
                    </select>
                </div>
                <div>
                    <label class="block text-[11px] font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Subject</label>
                    <select x-model="config.subject" class="w-full bg-slate-900 border border-slate-800 rounded-xl p-2.5 text-xs text-slate-200 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        <template x-for="sub in availableSubjects">
                            <option :value="sub" x-text="sub"></option>
                        </template>
                    </select>
                </div>
            </div>

            <!-- Question Pattern & Column Layout Option -->
            <div class="grid grid-cols-2 gap-3 sm:gap-4">
                <div>
                    <label class="block text-[11px] font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Question Pattern</label>
                    <select x-model="config.pattern" class="w-full bg-slate-900 border border-slate-800 rounded-xl p-2.5 text-xs text-slate-200 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        <option value="Single Option Correct">Single Option Correct (MCQ)</option>
                        <option value="One or More Than One Option Correct">One or More Than One Option Correct (JEE Advanced)</option>
                        <option value="Integer / Numerical Value Type">Integer / Numerical Value Type</option>
                        <option value="Paragraph / Comprehension Type">Paragraph / Comprehension Type</option>
                        <option value="Assertion Reason Type">Assertion-Reason Type</option>
                        <option value="Match the Column Type">Match the Column Type</option>
                    </select>
                </div>
                <div>
                    <label class="block text-[11px] font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Layout Format</label>
                    <select x-model="config.layout" class="w-full bg-slate-900 border border-slate-800 rounded-xl p-2.5 text-xs text-slate-200 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        <option value="double">Double Column (Booklet Style)</option>
                        <option value="single">Single Column (Detailed View)</option>
                    </select>
                </div>
            </div>

            <!-- Difficulty & Focus -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 sm:gap-4">
                <div>
                    <label class="block text-[11px] font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Difficulty Tier</label>
                    <select x-model="config.difficulty" class="w-full bg-slate-900 border border-slate-800 rounded-xl p-2.5 text-xs text-slate-200 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        <option value="Olympiad / Top Tier IIT Level">Olympiad / Top Tier IIT Level</option>
                        <option value="Standard JEE Advanced / AIIMS Level">Standard JEE Advanced / AIIMS Level</option>
                        <option value="Conceptual Foundation / Twist Level">Conceptual Foundation / Twist Level</option>
                    </select>
                </div>
                <div>
                    <label class="block text-[11px] font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Concept Focus (Topic)</label>
                    <input type="text" x-model="config.focus" placeholder="e.g., Time-varying B-field loop" class="w-full bg-slate-900 border border-slate-800 rounded-xl p-2.5 text-xs text-slate-200 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
            </div>

            <!-- Concept Prompt / Reference Input -->
            <div>
                <label class="block text-[11px] font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Hints / Context / Multi-Concept Links</label>
                <textarea x-model="config.promptText" rows="3" placeholder="Enter hints, core physical laws, structural ideas, or specific multi-concept links (e.g. combine EMI with energy conservation)..." class="w-full bg-slate-900 border border-slate-800 rounded-xl p-3 text-xs text-slate-200 focus:ring-2 focus:ring-indigo-500 focus:outline-none resize-none"></textarea>
            </div>

            <!-- Visual Context Suite -->
            <div class="bg-slate-900/60 border border-slate-800/80 rounded-2xl p-4 space-y-3">
                <div class="flex flex-wrap items-center justify-between gap-2">
                    <span class="text-[11px] font-semibold uppercase tracking-wider text-slate-400">Diagram Source</span>
                    <div class="flex space-x-1 bg-slate-950 p-1 rounded-xl border border-slate-800">
                        <button @click="visualMode = 'none'" :class="visualMode === 'none' ? 'bg-indigo-600 text-white shadow' : 'text-slate-400'" class="px-2.5 py-1 text-[11px] rounded-lg transition">None</button>
                        <button @click="visualMode = 'upload'" :class="visualMode === 'upload' ? 'bg-indigo-600 text-white shadow' : 'text-slate-400'" class="px-2.5 py-1 text-[11px] rounded-lg transition">Upload</button>
                        <button @click="visualMode = 'draw'" :class="visualMode === 'draw' ? 'bg-indigo-600 text-white shadow' : 'text-slate-400'" class="px-2.5 py-1 text-[11px] rounded-lg transition">Sketch</button>
                        <button @click="visualMode = 'paste'" :class="visualMode === 'paste' ? 'bg-indigo-600 text-white shadow' : 'text-slate-400'" class="px-2.5 py-1 text-[11px] rounded-lg transition">Paste</button>
                    </div>
                </div>

                <!-- Mode Upload -->
                <div x-show="visualMode === 'upload'" x-cloak class="border-2 border-dashed border-slate-800 rounded-xl p-4 text-center cursor-pointer hover:border-indigo-500/50 transition bg-slate-950/40">
                    <input type="file" @change="handleFileUpload" accept="image/*" class="hidden" id="fileUploadInput">
                    <label for="fileUploadInput" class="cursor-pointer flex flex-col items-center">
                        <i data-lucide="upload-cloud" class="w-6 h-6 text-indigo-400 mb-1"></i>
                        <span class="text-xs text-slate-300 font-medium" x-text="uploadedImageName || 'Click to browse circuit/diagram image'"></span>
                    </label>
                </div>

                <!-- Mode Sketchpad -->
                <div x-show="visualMode === 'draw'" x-cloak class="space-y-2">
                    <div class="border border-slate-800 rounded-xl bg-white overflow-hidden relative canvas-container shadow-inner">
                        <canvas id="sketchCanvas" width="400" height="180" class="w-full cursor-crosshair" @mousedown="startDrawing" @mousemove="draw" @mouseup="stopDrawing" @mouseleave="stopDrawing" @touchstart="startDrawing" @touchmove="draw" @touchend="stopDrawing"></canvas>
                    </div>
                    <div class="flex justify-between items-center px-1">
                        <span class="text-[10px] text-slate-500">Sketch circuit, ray diagram, or free-body layout</span>
                        <button @click="clearCanvas()" class="text-xs text-rose-400 hover:text-rose-300 font-medium">Clear Canvas</button>
                    </div>
                </div>

                <!-- Mode Paste -->
                <div x-show="visualMode === 'paste'" x-cloak class="space-y-2">
                    <div @paste="handlePasteImage" tabindex="0" class="border-2 border-dashed border-slate-800 rounded-xl p-4 text-center focus:border-cyan-500 outline-none bg-slate-950/40">
                        <i data-lucide="clipboard" class="w-5 h-5 text-cyan-400 mx-auto mb-1"></i>
                        <span class="text-xs text-slate-300">Click here & Press <kbd class="bg-slate-900 px-1.5 py-0.5 rounded text-[10px] border border-slate-800 text-slate-200">Ctrl+V</kbd> to paste clipboard image</span>
                    </div>
                </div>

                <!-- Preview Attachment -->
                <template x-if="attachedImage">
                    <div class="relative mt-2 inline-block">
                        <img :src="attachedImage" class="h-16 rounded-xl border border-slate-800 object-cover shadow-md">
                        <button @click="attachedImage = null; uploadedImageName = ''" class="absolute -top-2 -right-2 bg-rose-600 text-white rounded-full p-1 hover:bg-rose-500 shadow">
                            <i data-lucide="x" class="w-3 h-3"></i>
                        </button>
                    </div>
                </template>
            </div>

            <!-- Generate Button -->
            <button @click="generateQuestion()" :disabled="isGenerating" class="w-full bg-gradient-to-r from-amber-500 via-indigo-600 to-indigo-700 hover:from-amber-400 hover:to-indigo-600 text-white font-semibold py-3.5 px-4 rounded-xl shadow-lg shadow-indigo-950/50 transition flex items-center justify-center space-x-2 disabled:opacity-50">
                <template x-if="!isGenerating">
                    <div class="flex items-center space-x-2">
                        <i data-lucide="sparkles" class="w-5 h-5 text-amber-200"></i>
                        <span>Synthesize Original Question</span>
                    </div>
                </template>
                <template x-if="isGenerating">
                    <div class="flex items-center space-x-2">
                        <i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i>
                        <span x-text="generationStep"></span>
                    </div>
                </template>
            </button>

        </section>

        <!-- Right Panel: Output & Solution Display -->
        <section class="w-full lg:w-7/12 bg-slate-950 p-4 sm:p-6 lg:p-8 overflow-y-auto flex flex-col space-y-6">
            
            <template x-if="!generatedData && !isGenerating">
                <div class="flex-1 flex flex-col items-center justify-center text-center text-slate-500 space-y-4 py-16">
                    <div class="bg-slate-900/80 p-6 rounded-3xl border border-slate-800 shadow-xl">
                        <i data-lucide="crown" class="w-12 h-12 text-amber-400/80 animate-pulse"></i>
                    </div>
                    <div class="max-w-sm">
                        <h3 class="text-slate-300 font-semibold mb-1 text-sm">Question King Engine Ready</h3>
                        <p class="text-xs text-slate-500 leading-relaxed">Set your parameters, select layout format, and Rajan MV's Gemini engine will generate a justified, perfectly formatted problem.</p>
                    </div>
                </div>
            </template>

            <template x-if="generatedData">
                <div class="space-y-6 animate-fadeIn">
                    
                    <!-- Document Controls & Actions -->
                    <div class="no-print bg-slate-900/90 border border-slate-800 rounded-2xl p-4 space-y-3 shadow-lg">
                        <div class="flex flex-col sm:flex-row items-center justify-between gap-3">
                            <div class="w-full sm:flex-1">
                                <label class="block text-[10px] uppercase font-semibold text-slate-400 mb-1">Document Title / File Name Style</label>
                                <input type="text" x-model="docTitle" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-amber-500">
                            </div>
                            <div class="flex items-center space-x-2 w-full sm:w-auto justify-end shrink-0 pt-2 sm:pt-5">
                                <button @click="copyQuestionMarkdown()" class="text-xs text-slate-300 hover:text-white flex items-center space-x-1.5 bg-slate-950 px-3 py-2 rounded-xl border border-slate-800 transition shadow-sm">
                                    <i data-lucide="copy" class="w-3.5 h-3.5 text-amber-400"></i>
                                    <span>Copy Markdown</span>
                                </button>
                                <button @click="printOrSavePDF()" class="text-xs text-white flex items-center space-x-1.5 bg-gradient-to-r from-amber-600 to-indigo-600 hover:from-amber-500 hover:to-indigo-500 px-4 py-2 rounded-xl font-medium transition shadow-md">
                                    <i data-lucide="printer" class="w-3.5 h-3.5"></i>
                                    <span>Print / Save PDF (Justified Booklet)</span>
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- Printable Container wrapper styled exactly like Xylem booklet with Justified text -->
                    <div id="printableArea" class="print-paper-sheet bg-[#fdfbf7] text-[#111111] p-6 sm:p-10 rounded-2xl border border-slate-800 shadow-xl font-serif space-y-6 text-justify">
                        
                        <!-- Print Header -->
                        <div class="print-header-block text-center border-b-2 border-[#111111] pb-4 mb-6">
                            <h2 class="text-xl font-extrabold tracking-wider uppercase text-[#111111]" x-text="docTitle"></h2>
                            <p class="text-xs font-bold uppercase tracking-widest text-[#333333] mt-1" x-text="generatedData.exam + ' • ' + generatedData.subject"></p>
                        </div>

                        <!-- Dynamic Layout (Single or Double Column based on user choice) -->
                        <div :class="config.layout === 'double' ? 'grid grid-cols-1 md:grid-cols-2 gap-6 items-start' : 'space-y-4'">
                            
                            <!-- Question Block -->
                            <div class="print-question-box space-y-3">
                                <div class="flex items-start space-x-2">
                                    <span class="font-bold text-sm shrink-0">1.</span>
                                    <div class="text-sm leading-relaxed math-content flex-1 text-justify" x-html="renderFormattedMath(generatedData.questionStem)"></div>
                                </div>
                                
                                <template x-if="generatedData.diagramDescription">
                                    <div class="bg-slate-100 border border-slate-300 p-3 rounded text-center space-y-1">
                                        <span class="text-[10px] text-slate-600 uppercase tracking-wider block font-bold">Diagram Specification</span>
                                        <div class="text-xs text-indigo-900 font-mono bg-white p-2 rounded border border-slate-200" x-text="generatedData.diagramDescription"></div>
                                    </div>
                                </template>

                                <!-- Options Grid / List -->
                                <template x-if="generatedData.options && generatedData.options.length > 0">
                                    <div :class="config.layout === 'double' ? 'print-options-grid-2 grid grid-cols-2 gap-x-4 gap-y-2 pt-1 text-xs text-justify' : 'print-options-grid-1 flex flex-col gap-2 pt-1 text-xs text-justify'">
                                        <template x-for="(opt, idx) in generatedData.options">
                                            <div class="flex items-start space-x-1.5">
                                                <span class="font-bold shrink-0" x-text="'(' + ['1', '2', '3', '4'][idx] + ')'"></span>
                                                <span class="math-content text-justify" x-html="renderFormattedMath(opt)"></span>
                                            </div>
                                        </template>
                                    </div>
                                </template>
                            </div>

                        </div>

                        <!-- Professor Solution Section -->
                        <div class="print-solution-section pt-8 border-t-2 border-dashed border-slate-300 space-y-4 mt-8 text-justify">
                            <div class="flex items-center justify-between flex-wrap gap-2 border-b border-slate-300 pb-2">
                                <h4 class="text-xs font-bold uppercase tracking-widest text-[#111]">Verified Answer Key & Detailed Solution</h4>
                                <span class="text-xs font-mono font-bold bg-slate-200 px-3 py-1 rounded math-content" x-html="'Correct Answer: ' + renderFormattedMath(generatedData.correctAnswer)"></span>
                            </div>
                            
                            <div class="space-y-3 text-xs leading-relaxed text-[#222] text-justify">
                                <div class="space-y-1">
                                    <strong class="block uppercase text-[11px] text-indigo-900">Core Concept Pillar & The Surprise:</strong>
                                    <p class="text-justify math-content" x-html="renderFormattedMath(generatedData.conceptPillar)"></p>
                                </div>
                                
                                <div class="space-y-1">
                                    <strong class="block uppercase text-[11px] text-indigo-900">Step-by-Step Derivation:</strong>
                                    <div class="math-content space-y-1 text-justify" x-html="renderFormattedMath(generatedData.stepByStepSolution)"></div>
                                </div>

                                <div class="space-y-1 bg-amber-50 border-l-2 border-amber-600 p-2.5 rounded text-justify">
                                    <strong class="block uppercase text-[11px] text-amber-900">Exam Trap & Distractor Breakdown:</strong>
                                    <p class="text-justify math-content" x-html="renderFormattedMath(generatedData.pitfalls)"></p>
                                </div>
                            </div>
                        </div>

                    </div>

                </div>
            </template>

        </section>

    </main>

    <!-- App Logic & API Integration -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
        });

        function questionApp() {
            return {
                apiKey: localStorage.getItem('gemini_ai_key') || '',
                docTitle: 'ATOMIC STRUCTURE NEET CHEMISTRY',
                config: {
                    exam: 'JEE Advanced',
                    subject: 'Physics',
                    pattern: 'Single Option Correct',
                    difficulty: 'Standard JEE Advanced / AIIMS Level',
                    layout: 'double',
                    focus: '',
                    promptText: ''
                },
                availableSubjects: ['Physics', 'Physical Chemistry', 'Organic Chemistry', 'Inorganic Chemistry', 'Mathematics'],
                visualMode: 'none',
                uploadedImageName: '',
                attachedImage: null,
                isGenerating: false,
                generationStep: 'Synthesizing...',
                generatedData: null,
                
                isDrawing: false,
                canvasCtx: null,

                init() {
                    this.$watch('visualMode', (val) => {
                        if(val === 'draw') {
                            this.$nextTick(() => this.initCanvas());
                        }
                    });
                },

                onExamChange() {
                    if (this.config.exam === 'NEET') {
                        this.availableSubjects = ['Physics', 'Chemistry', 'Botany', 'Zoology'];
                        this.config.subject = 'Physics';
                    } else if (this.config.exam === 'JEE Advanced' || this.config.exam === 'JEE Main') {
                        this.availableSubjects = ['Physics', 'Physical Chemistry', 'Organic Chemistry', 'Inorganic Chemistry', 'Mathematics'];
                        this.config.subject = 'Physics';
                    }
                },

                saveApiKey() {
                    localStorage.setItem('gemini_ai_key', this.apiKey);
                    alert('Gemini API Key saved securely in browser storage.');
                },

                initCanvas() {
                    const canvas = document.getElementById('sketchCanvas');
                    if (!canvas) return;
                    this.canvasCtx = canvas.getContext('2d');
                    this.canvasCtx.strokeStyle = '#020617';
                    this.canvasCtx.lineWidth = 2.5;
                    this.canvasCtx.lineCap = 'round';
                },

                getCanvasCoordinates(e) {
                    const canvas = document.getElementById('sketchCanvas');
                    const rect = canvas.getBoundingClientRect();
                    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                    return {
                        x: clientX - rect.left,
                        y: clientY - rect.top
                    };
                },

                startDrawing(e) {
                    this.isDrawing = true;
                    const pos = this.getCanvasCoordinates(e);
                    this.canvasCtx.beginPath();
                    this.canvasCtx.moveTo(pos.x, pos.y);
                },

                draw(e) {
                    if (!this.isDrawing) return;
                    e.preventDefault();
                    const pos = this.getCanvasCoordinates(e);
                    this.canvasCtx.lineTo(pos.x, pos.y);
                    this.canvasCtx.stroke();
                },

                stopDrawing() {
                    if (!this.isDrawing) return;
                    this.isDrawing = false;
                    const canvas = document.getElementById('sketchCanvas');
                    this.attachedImage = canvas.toDataURL('image/png');
                },

                clearCanvas() {
                    const canvas = document.getElementById('sketchCanvas');
                    if(this.canvasCtx) {
                        this.canvasCtx.clearRect(0, 0, canvas.width, canvas.height);
                    }
                    this.attachedImage = null;
                },

                handleFileUpload(event) {
                    const file = event.target.files[0];
                    if (file) {
                        this.uploadedImageName = file.name;
                        const reader = new FileReader();
                        reader.onload = (e) => {
                            this.attachedImage = e.target.result;
                        };
                        reader.readAsDataURL(file);
                    }
                },

                handlePasteImage(e) {
                    const items = (e.clipboardData || e.originalEvent.clipboardData).items;
                    for (let item of items) {
                        if (item.type.indexOf('image') === 0) {
                            const blob = item.getAsFile();
                            const reader = new FileReader();
                            reader.onload = (event) => {
                                this.attachedImage = event.target.result;
                                this.uploadedImageName = 'pasted-diagram.png';
                            };
                            reader.readAsDataURL(blob);
                            break;
                        }
                    }
                },

                renderFormattedMath(text) {
                    if (!text) return '';
                    let processed = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
                    
                    try {
                        processed = processed.replace(/\$(.*?)\$/g, (match, p1) => {
                            return katex.renderToString(p1, { displayMode: false, throwOnError: false });
                        });
                    } catch (e) {
                        console.error('KaTeX error:', e);
                    }
                    return processed;
                },

                printOrSavePDF() {
                    document.title = this.docTitle || 'Question_King_Assessment';
                    window.print();
                },

                async generateQuestion() {
                    if (!this.apiKey) {
                        alert('Please enter your Gemini API key in the top bar.');
                        return;
                    }

                    this.isGenerating = true;
                    this.generationStep = 'Consulting Gemini 3.5 Flash-Lite Engine...';

                    // Updated Prompt strictly enforcing brevity and no AI monologue in the step-by-step solution
                    const systemInstruction = `Persona: Act as Rajan MV, a veteran question-setter and Chief ${this.config.subject} Content Creator for top-tier ${this.config.exam} coaching institutes.
                    Context: The target audience consists of 17-19-year-old students solving high-difficulty entrance papers.
                    Task: Generate 1 original ${this.config.exam} level question on the requested topic.
                    
                    Constraints:
                    - Do not use standard textbook plug-and-chug numbers; incorporate a multi-concept link (e.g., combining EMI with energy conservation).
                    - Provide 4 options where the distractors (wrong choices) correspond to common algebraic or conceptual student errors.
                    - Provide a step-by-step breakdown pointing out the "Exam Trap".
                    - Always keep a surprise thing or elegant shortcut in the solution.
                    - Format all mathematical variables and equations strictly in LaTeX wrapped in $...$.
                    - VERY IMPORTANT: For the "stepByStepSolution", do NOT output your internal thinking, reasoning process, or conversational filler (e.g. avoid phrases like "Let's break this down" or "First, we need to"). Provide only the FINAL, CORRECT mathematical and logical steps briefly and concisely.

                    You MUST return your response as a valid JSON object with these exact keys:
                    - "exam": string
                    - "subject": string
                    - "pattern": string
                    - "questionStem": string (rigorous phrasing with LaTeX math notation wrapped in $...$)
                    - "diagramDescription": string or null
                    - "options": array of 4 strings (if applicable, else empty array)
                    - "correctAnswer": string (with LaTeX formulas wrapped in $...$ if needed)
                    - "conceptPillar": string (Include the multi-concept link and outline the 'surprise thing')
                    - "stepByStepSolution": string (Brief, final, correct mathematical/logical steps ONLY. NO conversational filler or AI thinking process.)
                    - "pitfalls": string (Explicitly point out the "Exam Trap" and explain how the distractors were formed)`;

                    const promptText = `Generate a ${this.config.difficulty} question for ${this.config.exam} in ${this.config.subject}.
                    Pattern: ${this.config.pattern}
                    Topic / Core Concepts: ${this.config.focus}
                    Hints / Context provided: ${this.config.promptText}
                    ${this.attachedImage ? 'An attached diagram or sketch was provided.' : ''}`;

                    try {
                        const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent?key=${this.apiKey}`;
                        
                        let parts = [{ text: promptText }];
                        if (this.attachedImage) {
                            const base64Data = this.attachedImage.split(',')[1];
                            parts.push({
                                inline_data: {
                                    mime_type: "image/png",
                                    data: base64Data
                                }
                            });
                        }

                        const payload = {
                            system_instruction: {
                                parts: [{ text: systemInstruction }]
                            },
                            contents: [{
                                parts: parts
                            }],
                            generationConfig: {
                                response_mime_type: "application/json"
                            }
                        };

                        const response = await fetch(endpoint, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        });

                        const data = await response.json();
                        if (data.error) {
                            throw new Error(data.error.message);
                        }

                        const rawJSONText = data.candidates[0].content.parts[0].text;
                        this.generatedData = JSON.parse(rawJSONText);
                        this.isGenerating = false;

                        this.$nextTick(() => {
                            lucide.createIcons();
                        });

                    } catch (err) {
                        alert('Generation Error: ' + err.message);
                        this.isGenerating = false;
                    }
                },

                copyQuestionMarkdown() {
                    if (!this.generatedData) return;
                    const text = `### ${this.generatedData.exam} - ${this.generatedData.subject}\n\n**Question:**\n${this.generatedData.questionStem}\n\n**Options:**\n${this.generatedData.options.join('\n')}\n\n**Answer Key:** ${this.generatedData.correctAnswer}\n\n**Solution:**\n${this.generatedData.stepByStepSolution}`;
                    navigator.clipboard.writeText(text);
                    alert('Question, Answer Key, and solution copied to clipboard.');
                }
            }
        }
    </script>
